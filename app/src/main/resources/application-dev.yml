# dev 배포 프로필(momens-k8s-dev, 모바일 MVP 검증용).
# prod와 달리 dev에서는 이 서버가 DB 스키마를 소유합니다: base(application.yml)의
# flyway.enabled=true 를 그대로 상속해 새 서버 Flyway 가 product/signal 테이블을 만듭니다
# (prod 는 레거시 momens-api 가 단일 소유라 Flyway off). retrieval projection 등
# api-surrogate 스키마는 momens-k8s-dev 의 dev-schema-gap.sql 이 별도로 채웁니다(D42).
#
# 이 파일은 최소만 둡니다. 나머지 값은 base + Kubernetes Secret/ConfigMap 환경변수로 주입합니다:
# - DATABASE_URL / DATABASE_USERNAME / DATABASE_PASSWORD : Cloud SQL(PSC)
# - MOMENS_AUTH_JWT_SECRET
# - MOMENS_AUTH_GOOGLE_AUDIENCES : prod Android client-id 만(모바일 ID token aud allowlist)
# - MOMENS_NOTIFICATION_PUSH_FIREBASE_PROJECT_ID : FCM 대상 Firebase 프로젝트
# - GOOGLE_CLOUD_PROJECT / GOOGLE_CLOUD_LOCATION : 민수 Vertex AI 대상 프로젝트·리전(ConfigMap)
# - CORS_ALLOWED_ORIGINS 미주입 → base 기본값(빈 목록). 모바일은 네이티브라 CORS 대상 아님.
# - web OAuth(MOMENS_AUTH_GOOGLE_CLIENT_ID / _SECRET / _REDIRECT_URI,
#   MOMENS_AUTH_WEB_SUCCESS_REDIRECT_URI / _FAILURE_REDIRECT_URI)는 dev 미사용이지만
#   기동 시 @NotBlank 검증을 통과해야 하므로 non-functional 더미값을 Secret 으로 주입합니다.
#   명시적 501 비활성화는 P2 로 미룹니다.
spring:
  flyway:
    # prod 는 off. dev 는 이 서버가 스키마 소유자이므로 명시적으로 on 을 재확인합니다(안전 가드).
    enabled: true

momens:
  # dev는 Firebase dev 프로젝트로 signal.created push를 발송합니다(MOM-0690). GKE Workload
  # Identity가 전용 서비스 계정의 ADC를 공급하고 대상 project ID는 ConfigMap으로 주입합니다.
  # JSON 키나 credential Secret은 사용하지 않습니다.
  notification:
    push:
      enabled: true
  # dev는 민수(Vertex AI Gemini)로 실제 draft·suggestion을 생성합니다(MOM-0692). GKE Workload
  # Identity가 ADC를 공급하고 대상 project·location은 ConfigMap(GOOGLE_CLOUD_*)으로 주입합니다.
  minsu:
    enabled: true
  # dev 전용 토큰 발급 엔드포인트(MOM-90). @DevOnly 프로필에서만 로드됩니다.
  auth:
    dev-token:
      # 호출자 제한용 공유 시크릿. Kubernetes Secret 으로 주입하고 커밋하지 않습니다.
      secret: ${MOMENS_AUTH_DEV_TOKEN_SECRET}
      # 토큰을 발급할 테스트 사용자 allowlist(모먼스 개발팀).
      allowed-emails:
        - owner@momens.works
        - member@momens.works

logging:
  level:
    # dev 는 모바일 MVP 를 직접 검증하는 환경이라 문제 발생 시 kubectl logs 로 원인을 자주 추적합니다.
    # 애플리케이션 패키지만 DEBUG 로 올려 세부 로그를 남깁니다(root 등 그 외는 base 의 INFO 를 상속).
    works.momens.server: DEBUG
