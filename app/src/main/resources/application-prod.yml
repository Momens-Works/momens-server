# 운영 프로필.
# 모든 민감 값은 환경변수로 주입합니다(Kubernetes Secret / External Secrets 등).
# 이 파일에는 실제 secret 을 두지 않습니다.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    show-sql: false
  # prod 스키마는 이 서버가 소유합니다(ADR-0019). 다만 부트스트랩(MOM-0909)이 적용되기 전까지는
  # 여기를 끈 채로 둡니다. 미반영 스키마가 있는 상태에서 Flyway 가 켜지면 레거시가 이미 만든
  # 객체부터 다시 만들려다 죽습니다. 그동안은 ddl-auto=validate(공통)로 매핑만 검증합니다.
  #
  # 부트스트랩은 이 값을 여기서 바꾸지 않고 k8s ConfigMap 의 SPRING_FLYWAY_ENABLED 로 켭니다.
  # 환경변수가 설정 파일보다 우선하므로, 여기를 false 로 두면 **어떤 릴리스도 스스로 Flyway 를
  # 켤 수 없고** 전환 시점을 운영자가 쥡니다. 부트스트랩이 끝나면 이 값을 true 로 정본화하고
  # ConfigMap 오버라이드를 걷어냅니다.
  flyway:
    enabled: false

# CORS 허용 origin. 레거시 momens-api 와 동일하게 운영 기본값은 웹 도메인이고,
# CORS_ALLOWED_ORIGINS env 로 오버라이드합니다.
momens:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://app.momens.works}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    works.momens.server: INFO
  # 운영은 구조화 JSON 로그(Spring Boot 4.1 내장). 커스텀 appender를 두지 않습니다.
  # local/test는 사람이 읽는 console 포맷을 유지합니다.
  structured:
    format:
      console: logstash
