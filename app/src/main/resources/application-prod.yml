# 운영 프로필.
# 모든 민감 값은 환경변수로 주입합니다(Kubernetes Secret / External Secrets 등).
# 이 파일에는 실제 secret 을 두지 않습니다.
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    show-sql: false
  # 전환기 공유 Neon DB의 스키마는 레거시 momens-api가 단일 소유합니다. 새 서버는 운영에서
  # 스키마를 만들거나 바꾸지 않고 검증만 합니다(conformer). 따라서 prod 에서는 Flyway 를 끄고
  # ddl-auto=validate(공통)로 매핑만 검증합니다. 진짜 신규 테이블은 별도 레거시 마이그레이션으로
  # 추가합니다(이관 전략 결정①). local/test 는 새 서버 Flyway 가 그대로 소유합니다(별도 DB).
  flyway:
    enabled: false

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    works.momens.server: INFO
  # 운영은 구조화 JSON 로그(Spring Boot 4.1 내장). 커스텀 appender를 두지 않습니다.
  # local/test는 사람이 읽는 console 포맷을 유지합니다.
  structured:
    format:
      console: logstash
