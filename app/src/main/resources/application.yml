# 공통 설정만 둡니다.
# 환경별 값과 민감 정보는 .env / 프로필별 설정 / 환경변수 placeholder로 다룹니다.
spring:
  application:
    name: momens-server
  profiles:
    default: local
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

momens:
  openapi:
    server-url: ${MOMENS_OPENAPI_SERVER_URL:http://localhost:8080}
  auth:
    # HS256 대칭키(>=32바이트). 실제 값은 .env / 환경변수로 주입하고 커밋하지 않습니다.
    jwt-secret: ${MOMENS_AUTH_JWT_SECRET}
    # 짧은 access TTL이 권한 변경 즉시 반영의 근거입니다.
    access-ttl: 15m

# 헬스체크는 Actuator 기본 /actuator/health 만 노출합니다.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  # 로그 상관관계용 trace context(traceId/spanId)는 유지하되, 분산추적/메트릭/로그 OTLP
  # export는 비활성화합니다. collector endpoint와 sampling은 배포 환경 확정 시(별도 OTel
  # 티켓) 켭니다 — 그전엔 기본 endpoint(localhost:4318)로 전송을 시도해 연결 오류가 납니다.
  tracing:
    export:
      enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      otlp:
        enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 공통 baseline 로그 레벨. 프로필이 누락해도 안전한 기본값을 보장합니다.
# 프로필별 상세 레벨/포맷은 application-<profile>.yml 에서 override 합니다.
# 요청 상관관계(traceId/spanId)는 Micrometer Tracing 브리지가 자동으로 로그에 채웁니다.
logging:
  level:
    root: INFO
