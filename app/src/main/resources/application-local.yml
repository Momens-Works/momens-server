# 로컬 개발 프로필.
# 실제 값은 커밋하지 않는 .env 에서 주입합니다(.env.example 참고).
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/momens}
    username: ${DATABASE_USERNAME:momens}
    password: ${DATABASE_PASSWORD:momens}
  jpa:
    show-sql: true

momens:
  cors:
    # 로컬 웹 프론트(momens-fe) origin. 레거시처럼 localhost 와 127.0.0.1 둘 다 허용합니다.
    # 새 FE 는 3000 포트라(auth redirect 기준) 레거시 5173 대신 3000 을 씁니다.
    allowed-origins: http://localhost:3000,http://127.0.0.1:3000
  auth:
    # dev 전용 토큰 발급 엔드포인트(MOM-90). secret 은 .env 로 주입합니다(.env.example 참고).
    dev-token:
      secret: ${MOMENS_AUTH_DEV_TOKEN_SECRET}
      allowed-emails:
        - owner@momens.works
        - member@momens.works
    web:
      cookie:
        # 로컬은 http라 Secure 쿠키가 설정되지 않으므로 끕니다(운영 기본값은 true).
        secure: false

logging:
  level:
    works.momens.server: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  swagger-ui:
    enabled: true
