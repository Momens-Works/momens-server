import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'org.springframework.boot'
}

// 비-Boot 관리 의존성 버전.
// Spring Boot BOM이 관리하지 않는 의존성만 명시적으로 버전을 지정합니다.
ext {
    springModulithVersion = '2.1.0'
    springdocVersion = '3.0.3'
    springDotenvVersion = '5.1.0'
}

dependencies {
    // Spring Boot Gradle plugin이 제공하는 기본 BOM만 사용합니다.
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)
    testImplementation platform(SpringBootPlugin.BOM_COORDINATES)
    testAnnotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)

    // 기능/공유 모듈을 조립합니다.
    implementation project(':common')
    implementation project(':user')
    implementation project(':auth')

    // Core (Boot BOM 관리, 버전 생략)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 로그 상관관계용 traceId/spanId(MDC 전파). starter가 OTel SDK 자동구성 + Micrometer
    // Tracing 브리지를 함께 제공합니다(bridge 단독 의존성으론 Tracer 빈이 배선되지 않음).
    // export 비활성화·collector 등 배경은 docs/rules/observability.md 참고.
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Persistence / Migration (Boot BOM 관리)
    // Boot 4는 Flyway 자동구성을 spring-boot-flyway 모듈로 분리합니다. flyway-core 단독으로는
    // 자동 마이그레이션이 동작하지 않으므로 starter로 가져옵니다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Spring Modulith (별도 릴리스 트레인, 명시적 버전)
    implementation "org.springframework.modulith:spring-modulith-starter-core:${springModulithVersion}"

    // API 문서 / 로컬 env (Boot BOM 비관리, 명시적 버전)
    implementation "org.springdoc:springdoc-openapi-starter-webmvc-ui:${springdocVersion}"
    implementation "me.paulschwarz:spring-dotenv:${springDotenvVersion}"

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "org.springframework.modulith:spring-modulith-starter-test:${springModulithVersion}"
    // Testcontainers 통합테스트 베이스(common testFixtures)를 재사용합니다.
    testImplementation testFixtures(project(':common'))
}
