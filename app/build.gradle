import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'org.springframework.boot'
}

dependencies {
    // Spring Boot Gradle plugin이 제공하는 기본 BOM만 사용합니다.
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)
    testImplementation platform(SpringBootPlugin.BOM_COORDINATES)
    testAnnotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)

    // 기능/공유 모듈을 조립합니다.
    implementation project(':common')
    implementation project(':user')
    implementation project(':auth')
    implementation project(':workspace')
    implementation project(':project')
    implementation project(':source')
    implementation project(':context')
    implementation project(':signal')
    implementation project(':outbox')
    implementation project(':notification')
    implementation project(':mobile')
    implementation project(':minsu')
    implementation project(':web')

    // Core (Boot BOM 관리, 버전 생략)
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // 로그 상관관계용 traceId/spanId(MDC 전파). starter가 OTel SDK 자동구성 + Micrometer
    // Tracing 브리지를 함께 제공합니다(bridge 단독 의존성으론 Tracer 빈이 배선되지 않음).
    // export 비활성화·collector 등 배경은 docs/rules/observability.md 참고.
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    // Persistence / Migration (Boot BOM 관리)
    // Boot 4는 Flyway 자동구성을 spring-boot-flyway 모듈로 분리합니다. flyway-core 단독으로는
    // 자동 마이그레이션이 동작하지 않으므로 starter로 가져옵니다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Spring Modulith는 Spring Boot BOM과 별도의 릴리스 트레인을 따르므로, 버전은 버전 카탈로그에서 고정합니다.
    implementation libs.spring.modulith.starter.core

    // API 문서 및 로컬 env 관련 의존성입니다. Spring Boot BOM 관리 대상이 아니므로
    // 버전 카탈로그에서 버전을 고정합니다.
    implementation libs.springdoc.openapi.starter.webmvc.ui
    implementation libs.swagger.core.jakarta
    implementation libs.spring.dotenv

    // Lombok
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation libs.spring.modulith.starter.test
    // Testcontainers 통합테스트 베이스(common testFixtures)를 재사용합니다.
    testImplementation testFixtures(project(':common'))
    // 보안 통합테스트용 access token 팩토리(auth public testFixtures). auth.internal 직접 참조를 피합니다.
    testImplementation testFixtures(project(':auth'))
    // Minsu 통합테스트가 llm nested module을 직접 참조하지 않고 provider 응답을 제어합니다.
    testImplementation testFixtures(project(':minsu'))
    // 실제 request/response를 /v3/api-docs 스펙과 대조하는 계약 검증(문서-응답 드리프트 방지).
    testImplementation libs.openapi.request.validator.mockmvc
    // push 기능 활성화를 검증하는 통합 테스트에서 FirebaseMessaging을 mock으로 대체하기 위해 필요합니다.
    testImplementation libs.firebase.admin
}

// OpenAPI 스냅샷(docs/spec/openapi.json)은 커밋본과 실제 문서를 대조하는 계약 게이트입니다(MOM-0878).
// test 는 비교만 하고, 파일을 쓰는 것은 아래 갱신 task 뿐입니다. 갱신을 이름 있는 명시적 행위로 두어
// 계약 변경이 PR diff에 드러나게 합니다.
def openApiSnapshotFile = rootProject.file('docs/spec/openapi.json')

tasks.named('test') {
    systemProperty 'momens.openapi.snapshot.path', openApiSnapshotFile.absolutePath
    // 스냅샷 파일은 test 의 입력이므로 명시합니다. 선언하지 않으면 스냅샷만 바뀌었을 때
    // test 가 up-to-date 로 스킵되거나 빌드 캐시에서 복원되어 게이트가 조용히 통과합니다.
    inputs.file(openApiSnapshotFile)
            .withPropertyName('openApiSnapshot')
            .withPathSensitivity(PathSensitivity.NONE)
}

// test 에 write 프로퍼티를 얹어 재사용하면 up-to-date 캐시로 두 번째 실행이 스킵되므로
// 별도 Test task 로 등록합니다.
tasks.register('updateOpenApiSnapshot', Test) {
    group = 'documentation'
    description = 'OpenAPI 스냅샷(docs/spec/openapi.json)을 현재 API 문서로 갱신합니다.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    filter {
        includeTestsMatching 'works.momens.server.support.openapi.OpenApiSnapshotTest'
    }
    systemProperty 'momens.openapi.snapshot.path', openApiSnapshotFile.absolutePath
    systemProperty 'momens.openapi.snapshot.write', 'true'
    outputs.upToDateWhen { false }
}
