import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java-library'
}

dependencies {
    // Boot BOM으로 버전을 관리합니다(boot 플러그인은 app만 적용).
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)
    testImplementation platform(SpringBootPlugin.BOM_COORDINATES)

    // 공유 영속성 베이스(BaseEntity 등)와 공유 에러 계약(ErrorCode/BusinessException).
    implementation project(':common')

    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    // /me 컨트롤러(presentation)와 요청 DTO 검증.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // OpenAPI 문서화 애너테이션(@Tag/@Operation/@Schema)만 사용합니다. Swagger UI·공통 설정은
    // 실행·조립 모듈인 app이 springdoc starter로 소유합니다(docs/spec/openapi.md).
    implementation 'io.swagger.core.v3:swagger-annotations-jakarta:2.2.53'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // common testFixtures의 Testcontainers 통합테스트 베이스를 재사용합니다.
    testImplementation testFixtures(project(':common'))
    // 컨트롤러 web 슬라이스 테스트(@WebMvcTest, @MockitoBean).
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}
