plugins {
    id 'org.springframework.boot' version '4.1.0' apply false
    id 'com.diffplug.spotless' version '8.7.0' apply false
}

allprojects {
    group = 'works.momens'
    version = '0.1.0-SNAPSHOT'
}

// 루트의 build.gradle과 settings.gradle도 마지막 줄 개행과 공백 정리를 강제합니다.
// java 블록은 .java만 다뤄서 gradle 파일이 검사에서 빠졌고, 리뷰에서 두 번 지적됐습니다(PR #41, #42).
apply plugin: 'com.diffplug.spotless'

spotless {
    format 'gradle', {
        target '*.gradle'
        trimTrailingWhitespace()
        endWithNewline()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'com.diffplug.spotless'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    repositories {
        mavenCentral()
    }

    tasks.named('test') {
        useJUnitPlatform()
    }

    spotless {
        java {
            googleJavaFormat()
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
        // 모듈 build.gradle의 마지막 줄 개행과 공백 정리도 강제합니다(위 루트 설정과 같은 이유).
        format 'gradle', {
            target '*.gradle'
            trimTrailingWhitespace()
            endWithNewline()
        }
    }
}
