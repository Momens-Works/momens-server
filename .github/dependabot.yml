version: 2
updates:
  # Gradle 의존성은 별도로 검증합니다. 버전을 명시하는 모든 의존성은 루트 프로젝트의
  # 버전 카탈로그에서 일괄 관리합니다.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"

  # GitHub Actions 워크플로
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
