name: PR Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  pr-format:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title and body
        # PR 제목/본문은 신뢰할 수 없는 입력이므로 env 로만 전달하고 스크립트에 직접 보간하지 않습니다.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -uo pipefail
          fail=0

          # 1) 제목: [Feature]/[Bug]/[Refactor]/[Chore]/[Docs] prefix + 제목
          if [[ ! "$PR_TITLE" =~ ^\[(Feature|Bug|Refactor|Chore|Docs)\]\ .+ ]]; then
            echo "::error::PR 제목은 '[유형] 제목' 형식이어야 합니다. 허용 유형: Feature/Bug/Refactor/Chore/Docs"
            echo "  현재 제목: $PR_TITLE"
            fail=1
          fi

          # 2) 본문: 비어 있지 않아야 함
          if [[ -z "${PR_BODY//[[:space:]]/}" ]]; then
            echo "::error::PR 본문이 비어 있습니다. PR 템플릿을 작성해주세요."
            fail=1
          else
            # 필수 섹션 존재 확인
            for section in "## 요약" "## 작업 유형" "## 검증"; do
              if ! grep -qF "$section" <<<"$PR_BODY"; then
                echo "::error::PR 본문에 '$section' 섹션이 없습니다."
                fail=1
              fi
            done

            # 작업 유형/체크리스트에 최소 1개 체크
            if ! grep -qE '^[[:space:]]*- \[[xX]\]' <<<"$PR_BODY"; then
              echo "::error::체크된 항목(- [x])이 없습니다. 작업 유형을 최소 1개 체크해주세요."
              fail=1
            fi
          fi

          if [[ "$fail" -ne 0 ]]; then
            echo "PR 형식 검증 실패. 위 에러를 확인하고 PR 제목/본문을 수정해주세요."
            exit 1
          fi
          echo "PR 제목/본문 형식 OK"
