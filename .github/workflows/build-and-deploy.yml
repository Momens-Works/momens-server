name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 같은 ref 의 이전 실행은 취소합니다(불필요한 중복 빌드 방지).
concurrency:
  group: build-momens-server-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/momens-works/momens-server

jobs:
  build-and-dispatch:
    runs-on: ubuntu-latest

    # 실제 강제 지점입니다(MOM-0948). production environment 의 deployment branch policy 가
    # main 만 허용하므로, 다른 ref 로 실행하면 job 이 runner 에 배정되기 전에 막힙니다.
    #
    # 그리고 K8S_REPO_DISPATCH_TOKEN 은 repository secret 이 아니라 이 environment 의
    # secret 입니다. workflow_dispatch 는 **선택한 ref 의 워크플로 파일**을 실행하므로 아래
    # 가드 스텝만으로는 막을 수 없습니다 — 가드가 없던 시절의 브랜치를 고르면 그 파일이
    # 그대로 돕니다. 그때 그 파일은 environment 를 선언하지 않아 토큰을 읽지 못하고,
    # Request production deploy 가 빈 토큰으로 건너뛰어 prod 로 나가지 않습니다.
    environment: production

    # step if 에서 참조하려면 job 레벨 env 여야 합니다.
    env:
      K8S_DISPATCH_TOKEN: ${{ secrets.K8S_REPO_DISPATCH_TOKEN }}

    steps:
      # environment 가 이미 막지만, 실수로 다른 ref 를 고른 사람에게 이유를 알려 주는 가드를
      # 함께 둡니다. 이 스텝은 보안 경계가 아닙니다 — 옛 브랜치에는 이 스텝이 없습니다.
      #
      # github.ref 를 run: 안에 직접 치환하지 않습니다. 브랜치 이름은 신뢰할 수 없는 입력이고
      # git 은 `;` `&` `` ` `` 같은 셸 메타문자를 refname 에 허용합니다. 기본 환경변수로 받습니다.
      - name: Refuse to deploy a non-main ref
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::prod 배포는 main 에서만 가능합니다. 현재 ref: $GITHUB_REF"
          echo "머지되지 않은 커밋을 배포하려면 먼저 PR 로 main 에 올리세요." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULES_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # k8s 레포에 배포를 요청합니다. deploy-momens-server 핸들러와
      # K8S_REPO_DISPATCH_TOKEN secret 이 있어야 동작합니다(배포 담당자 조율).
      # 토큰이 없으면 이 스텝을 건너뛰어, 이미지 push 까지만 돌고 워크플로는 성공으로 남습니다.
      - name: Request production deploy
        if: ${{ env.K8S_DISPATCH_TOKEN != '' }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $K8S_DISPATCH_TOKEN" \
            https://api.github.com/repos/Momens-Works/k8s/dispatches \
            -d "{\"event_type\":\"deploy-momens-server\",\"client_payload\":{\"image_tag\":\"${{ github.sha }}\"}}"
