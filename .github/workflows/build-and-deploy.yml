name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 같은 ref 의 이전 실행은 취소합니다(불필요한 중복 빌드 방지).
concurrency:
  group: build-momens-server-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/momens-works/momens-server

jobs:
  build-and-dispatch:
    runs-on: ubuntu-latest
    # step if 에서 참조하려면 job 레벨 env 여야 합니다.
    env:
      K8S_DISPATCH_TOKEN: ${{ secrets.K8S_REPO_DISPATCH_TOKEN }}

    steps:
      # workflow_dispatch 는 실행 ref 를 사람이 고르므로, 막지 않으면 머지되지 않은 브랜치가
      # 그대로 prod 로 갑니다. 필수 체크(build·pr-format)와 리뷰는 전부 pull_request 에서만
      # 도는데 이 경로는 그 전부를 건너뜁니다(MOM-0948).
      #
      # main 은 protected-main ruleset 이 PR·승인 1명·필수 체크를 강제하므로, 배포 대상을
      # main 으로 한정하면 prod 에 나가는 것은 전부 그 관문을 지난 커밋이 됩니다.
      #
      # job 레벨 if 로 건너뛰지 않고 스텝에서 실패시킵니다. skip 은 초록으로 보여서 왜 배포가
      # 안 됐는지 드러나지 않습니다.
      - name: Refuse to deploy a non-main ref
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::prod 배포는 main 에서만 가능합니다. 현재 ref: ${{ github.ref }}"
          echo "머지되지 않은 커밋을 배포하려면 먼저 PR 로 main 에 올리세요." >&2
          exit 1

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULES_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # k8s 레포에 배포를 요청합니다. deploy-momens-server 핸들러와
      # K8S_REPO_DISPATCH_TOKEN secret 이 있어야 동작합니다(배포 담당자 조율).
      # 토큰이 없으면 이 스텝을 건너뛰어, 이미지 push 까지만 돌고 워크플로는 성공으로 남습니다.
      - name: Request production deploy
        if: ${{ env.K8S_DISPATCH_TOKEN != '' }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $K8S_DISPATCH_TOKEN" \
            https://api.github.com/repos/Momens-Works/k8s/dispatches \
            -d "{\"event_type\":\"deploy-momens-server\",\"client_payload\":{\"image_tag\":\"${{ github.sha }}\"}}"
