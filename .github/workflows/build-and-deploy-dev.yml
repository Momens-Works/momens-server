name: Build and deploy (dev)

# CI(테스트 포함)가 develop push 에서 성공한 뒤에만 dev 배포를 진행합니다. push 로 직접
# 트리거하면 테스트 결과와 무관하게 이미지가 빌드·배포되므로, CI 성공을 게이트로 둡니다.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# dev 는 단일 환경이라 자동(workflow_run)·수동(workflow_dispatch) 배포를 한 그룹으로 묶어
# 최신 실행만 진행합니다. 이벤트별로 ref 표현이 달라 그룹이 갈리는 것을 막으려 고정 문자열을
# 씁니다(늦게 끝난 실행이 dev 를 이전 SHA 로 되돌리는 레이스 방지).
concurrency:
  group: build-momens-server-dev
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/momens-works/momens-server

jobs:
  build-and-dispatch:
    runs-on: ubuntu-latest
    # workflow_run 은 PR CI 완료로도 발화하므로, develop push 에서 성공한 CI 만 배포합니다.
    # workflow_dispatch 수동 실행은 게이트 없이 그대로 허용합니다.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    # step if 에서 참조하려면 job 레벨 env 여야 합니다.
    env:
      K8S_DEV_DISPATCH_TOKEN: ${{ secrets.MOMENS_K8S_DEV_DISPATCH_TOKEN }}
      # 배포 대상 커밋: workflow_run 은 트리거한 CI 의 head_sha, 수동 실행은 현재 ref.
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      DEPLOY_REF: ${{ github.event.workflow_run.head_branch || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULES_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # dev 배포 정책(D18)상 commit SHA 태그만 push 합니다. prod 워크플로와
      # 달리 latest 등 mutable 태그는 만들지 않습니다.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # momens-k8s-dev 레포에 dev 배포를 요청합니다. deploy-momens-server 핸들러와
      # MOMENS_K8S_DEV_DISPATCH_TOKEN secret 이 있어야 동작합니다.
      # 토큰이 없으면 이 스텝을 건너뛰어, 이미지 push 까지만 돌고 워크플로는 성공으로 남습니다.
      - name: Request dev deploy
        if: ${{ env.K8S_DEV_DISPATCH_TOKEN != '' }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $K8S_DEV_DISPATCH_TOKEN" \
            https://api.github.com/repos/Momens-Works/momens-k8s-dev/dispatches \
            -d "{\"event_type\":\"deploy-momens-server\",\"client_payload\":{\"image_tag\":\"${DEPLOY_SHA}\",\"source_branch\":\"${DEPLOY_REF}\"}}"
