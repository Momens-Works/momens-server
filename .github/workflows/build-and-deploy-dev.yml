name: Build and deploy (dev)

on:
  push:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 같은 ref 의 이전 실행은 취소합니다(불필요한 중복 빌드 방지).
concurrency:
  group: build-momens-server-dev-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/momens-works/momens-server

jobs:
  build-and-dispatch:
    runs-on: ubuntu-latest
    # step if 에서 참조하려면 job 레벨 env 여야 합니다.
    env:
      K8S_DEV_DISPATCH_TOKEN: ${{ secrets.MOMENS_K8S_DEV_DISPATCH_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # dev 배포 정책(D18)상 commit SHA 태그만 push 합니다. prod 워크플로와
      # 달리 latest 등 mutable 태그는 만들지 않습니다.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # momens-k8s-dev 레포에 dev 배포를 요청합니다. deploy-momens-server 핸들러와
      # MOMENS_K8S_DEV_DISPATCH_TOKEN secret 이 있어야 동작합니다.
      # 토큰이 없으면 이 스텝을 건너뛰어, 이미지 push 까지만 돌고 워크플로는 성공으로 남습니다.
      - name: Request dev deploy
        if: ${{ env.K8S_DEV_DISPATCH_TOKEN != '' }}
        run: |
          curl -fsS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $K8S_DEV_DISPATCH_TOKEN" \
            https://api.github.com/repos/Momens-Works/momens-k8s-dev/dispatches \
            -d "{\"event_type\":\"deploy-momens-server\",\"client_payload\":{\"image_tag\":\"${{ github.sha }}\",\"source_branch\":\"${{ github.ref_name }}\"}}"
