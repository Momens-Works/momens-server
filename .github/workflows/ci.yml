name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

# 같은 ref 의 이전 실행은 취소합니다(불필요한 중복 실행 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.CI_SUBMODULES_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # 포맷 검사·테스트·부트 jar 를 한 번의 Gradle 호출로 묶습니다. 구성 단계와 태스크
      # 그래프를 재사용해 스텝별로 Gradle 을 다시 띄우는 비용을 줄입니다. 실패 지점은
      # Gradle 출력에서 확인합니다.
      - name: Check, test, build
        run: ./gradlew spotlessCheck test bootJar

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: app/build/reports/tests/test/
          retention-days: 7
