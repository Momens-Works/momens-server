name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

# 같은 ref 의 이전 실행은 취소합니다(불필요한 중복 실행 방지).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Format check
        run: ./gradlew spotlessCheck

      - name: Test
        run: ./gradlew test

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests/test/
          retention-days: 7

      - name: Build boot jar
        run: ./gradlew bootJar
