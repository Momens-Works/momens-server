import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    id 'java-library'
    id 'java-test-fixtures'
}

dependencies {
    // Boot BOM으로 버전을 관리합니다(boot 플러그인은 app만 적용).
    implementation platform(SpringBootPlugin.BOM_COORDINATES)
    annotationProcessor platform(SpringBootPlugin.BOM_COORDINATES)
    testImplementation platform(SpringBootPlugin.BOM_COORDINATES)

    // 공유 에러 계약(ErrorCode/ErrorResponse)과 로그인 시 호출할 user public API.
    implementation project(':common')
    implementation project(':user')

    // SecurityFilterChain DSL + 서블릿 보안. 코드 소유권은 auth 모듈에 둡니다(docs/design/module-map.md).
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // Bearer 인증을 oauth2ResourceServer로 선언적 처리. 우리/Google 토큰 검증을 같은 Nimbus 계열로 통일.
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    // 인증/인가 거부 핸들러의 HttpServletResponse, @ConfigurationProperties 검증.
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    // 인증/인가 거부 본문(ErrorResponse) 직렬화용 Jackson(Boot BOM 관리, 버전 생략). Boot 4 webmvc·json
    // 스타터가 jackson-databind를 compile classpath로 노출하지 않아 명시합니다.
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    // momens.auth.* 설정 메타데이터 생성.
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 다른 모듈의 보안 통합테스트가 모듈 경계를 지키며 access token을 만들 수 있도록 제공하는 testFixtures.
    // internal 토큰 발급/서명을 캡슐화하고 public 팩토리만 노출합니다.
    testFixturesImplementation platform(SpringBootPlugin.BOM_COORDINATES)
    testFixturesImplementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // common testFixtures의 Testcontainers 통합테스트 베이스를 재사용합니다(refresh store 통합테스트 등).
    testImplementation testFixtures(project(':common'))
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
}
